name: Check starter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select repository toolchain
        run: |
          pnpm_spec=$(node -p 'require("./package.json").packageManager')
          npm install --global "$pnpm_spec"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show active-toolchain
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Run shared checks
        run: |
          mkdir -p output
          pnpm check > output/check.log 2>&1 || { cat output/check.log; exit 1; }
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
          shasum -a 256 dist/index.html dist/assets/* > output/dist.sha256
          echo 'All shared checks passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build unsigned native app from verified frontend
        run: |
          shasum -a 256 -c output/dist.sha256
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          writeFileSync(join(process.env.RUNNER_TEMP, "tauri-ci.json"), JSON.stringify({build: {beforeBuildCommand: null}}));
          JS
          pnpm tauri build --debug --bundles app --no-sign --config "$RUNNER_TEMP/tauri-ci.json" > output/native-build.log 2>&1 || { cat output/native-build.log; exit 1; }
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
          echo 'Unsigned macOS app built. Native UI and persistence require separate runtime acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: starter-failure-diagnostics
          path: |
            output/
            test-results/
            playwright-report/
          if-no-files-found: ignore
